<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미국 급등주 스캐너</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f6fa;
  color:#1e293b;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}

.container{
  width:100%;
  max-width:700px;
  margin:0 auto;
  padding:20px 14px 40px;
}

.card{
  background:#fff;
  border-radius:30px;
  padding:30px;
  box-shadow:0 12px 40px rgba(0,0,0,.08);
}

.rank{
  font-size:22px;
  color:#64748b;
  font-weight:700;
  margin-bottom:15px;
}

.ticker{
  font-size:54px;
  font-weight:900;
  letter-spacing:-2px;
}

.name{
  font-size:23px;
  color:#64748b;
  margin-top:4px;
  margin-bottom:30px;
}

.top-info{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:15px;
  margin-bottom:22px;
}

.label{
  color:#64748b;
  font-size:17px;
  font-weight:700;
  margin-bottom:6px;
}

.value{
  font-size:25px;
  font-weight:900;
}

.up{
  color:#218653;
}

.red{
  color:#c93d35;
}

.orange{
  color:#c95a16;
}

.purple{
  color:#6547c5;
}

.green{
  color:#27834d;
}

.score-box{
  background:#eef1f5;
  border-radius:28px;
  padding:26px 30px;
  margin:18px 0;
}

.score-title{
  font-size:22px;
  font-weight:700;
  color:#64748b;
  margin-bottom:8px;
}

.score-value{
  font-size:40px;
  font-weight:900;
  margin-bottom:15px;
}

.bar{
  width:100%;
  height:20px;
  background:#d8dee8;
  border-radius:20px;
  overflow:hidden;
}

.bar-fill{
  height:100%;
  border-radius:20px;
  background:#218653;
}

.bar-purple{
  background:#6547c5;
}

.bar-red{
  background:#d4453f;
}

/* 🔥 자동 눌림목 */
.pullback-box{
  background:#fff8ef;
  border:2px solid #f1d1a4;
  border-radius:28px;
  padding:25px 30px;
  margin:20px 0 26px;
}

.pullback-title{
  color:#64748b;
  font-size:22px;
  font-weight:800;
  margin-bottom:10px;
}

.pullback-range{
  color:#d95c00;
  font-size:34px;
  font-weight:900;
  margin-bottom:10px;
}

.pullback-desc{
  color:#64748b;
  font-size:17px;
  font-weight:600;
}

.trade-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px 35px;
  margin-top:25px;
}

.trade-item .label{
  font-size:19px;
}

.trade-item .price{
  font-size:30px;
  font-weight:900;
}

.status{
  display:inline-block;
  padding:12px 20px;
  border-radius:18px;
  background:#e9eef6;
  color:#4167a5;
  font-size:19px;
  font-weight:800;
  margin-top:30px;
}

.note{
  margin-top:25px;
  color:#64748b;
  font-size:15px;
  line-height:1.6;
  font-weight:600;
}

.empty{
  text-align:center;
  padding:80px 20px;
  color:#64748b;
  font-size:22px;
}

@media(max-width:480px){

  .container{
    padding:10px 8px 30px;
  }

  .card{
    padding:24px 18px;
    border-radius:25px;
  }

  .ticker{
    font-size:48px;
  }

  .top-info{
    gap:10px;
  }

  .value{
    font-size:21px;
  }

  .score-box,
  .pullback-box{
    padding:22px;
  }

  .score-value{
    font-size:35px;
  }

  .pullback-range{
    font-size:28px;
  }

  .trade-grid{
    gap:22px;
  }

  .trade-item .price{
    font-size:26px;
  }
}

</style>
</head>

<body>

<div class="container" id="app">
  <div class="empty">데이터 불러오는 중...</div>
</div>

<script>

/* =====================================================
   데이터 불러오기
===================================================== */

async function loadData(){

  try{

    const response = await fetch("data.json?ts=" + Date.now());

    if(!response.ok){
      throw new Error("data.json을 불러올 수 없습니다.");
    }

    const json = await response.json();

    /*
      data.json이 배열이든
      {stocks:[...]} 구조든 둘 다 처리
    */

    let stocks = Array.isArray(json)
      ? json
      : (json.stocks || json.data || []);

    if(!stocks.length){
      throw new Error("종목 데이터가 없습니다.");
    }

    renderStock(stocks[0]);

  }catch(error){

    console.error(error);

    document.getElementById("app").innerHTML = `
      <div class="empty">
        데이터 불러오기 실패<br><br>
        data.json 파일을 확인하세요.
      </div>
    `;
  }
}


/* =====================================================
   숫자 변환
===================================================== */

function num(v){

  if(v === undefined || v === null || v === ""){
    return 0;
  }

  if(typeof v === "number"){
    return v;
  }

  return Number(
    String(v)
      .replace(/[$,%]/g,"")
      .replace(/,/g,"")
  ) || 0;
}


/* =====================================================
   가격 표시
===================================================== */

function price(v){

  const n = num(v);

  if(n <= 0){
    return "-";
  }

  return "$" + n.toFixed(2);
}


/* =====================================================
   오늘의 대장 가능성
===================================================== */

function calculateLeader(stock){

  let score = 0;

  const change = num(
    stock.change ??
    stock.changePct ??
    stock.pctChange
  );

  const rvol = num(
    stock.rvol ??
    stock.relativeVolume ??
    stock.volumeRatio
  );

  const volume = num(
    stock.volume ??
    stock.vol
  );

  const high = num(
    stock.high ??
    stock.dayHigh
  );

  const priceNow = num(
    stock.price ??
    stock.currentPrice ??
    stock.close
  );

  if(change >= 5) score += 15;
  if(change >= 10) score += 15;
  if(change >= 20) score += 15;
  if(change >= 50) score += 10;

  if(rvol >= 2) score += 10;
  if(rvol >= 5) score += 10;
  if(rvol >= 10) score += 10;

  if(volume >= 100000) score += 5;

  if(high > 0 && priceNow > 0){

    const highPosition = priceNow / high;

    if(highPosition >= 0.95){
      score += 10;
    }

    if(highPosition >= 0.98){
      score += 5;
    }
  }

  return Math.min(100, Math.round(score));
}


/* =====================================================
   🔥 주포 개입 가능성
===================================================== */

function calculateMainPlayer(stock){

  let score = 0;

  const change = num(
    stock.change ??
    stock.changePct ??
    stock.pctChange
  );

  const rvol = num(
    stock.rvol ??
    stock.relativeVolume ??
    stock.volumeRatio
  );

  const high = num(
    stock.high ??
    stock.dayHigh
  );

  const priceNow = num(
    stock.price ??
    stock.currentPrice ??
    stock.close
  );

  const low = num(
    stock.low ??
    stock.dayLow
  );

  const open = num(
    stock.open ??
    stock.openPrice
  );

  /* 급등 */

  if(change >= 10) score += 15;
  if(change >= 20) score += 15;
  if(change >= 50) score += 10;

  /* 거래량 폭증 */

  if(rvol >= 3) score += 15;
  if(rvol >= 5) score += 15;
  if(rvol >= 10) score += 10;

  /* 고점 근처 유지 */

  if(high > 0 && priceNow > 0){

    const highPosition = priceNow / high;

    if(highPosition >= 0.95){
      score += 15;
    }

    if(highPosition >= 0.98){
      score += 5;
    }
  }

  /* 양봉 */

  if(open > 0 && priceNow > open){
    score += 5;
  }

  /* 저점에서 강하게 반등 */

  if(low > 0 && high > low && priceNow > 0){

    const rangePosition =
      (priceNow - low) / (high - low);

    if(rangePosition >= 0.75){
      score += 5;
    }
  }

  return Math.min(100, Math.round(score));
}


/* =====================================================
   ⚠️ 설거지 위험
===================================================== */

function calculateDumpRisk(stock){

  let risk = 0;

  const high = num(
    stock.high ??
    stock.dayHigh
  );

  const priceNow = num(
    stock.price ??
    stock.currentPrice ??
    stock.close
  );

  const change = num(
    stock.change ??
    stock.changePct ??
    stock.pctChange
  );

  const rvol = num(
    stock.rvol ??
    stock.relativeVolume ??
    stock.volumeRatio
  );

  if(high > 0 && priceNow > 0){

    const dropFromHigh =
      ((high - priceNow) / high) * 100;

    if(dropFromHigh >= 5) risk += 20;
    if(dropFromHigh >= 10) risk += 20;
    if(dropFromHigh >= 20) risk += 25;
    if(dropFromHigh >= 30) risk += 20;
  }

  /* 급등 후 거래량 부족 */

  if(change >= 30 && rvol < 2){
    risk += 15;
  }

  if(change >= 50 && rvol < 3){
    risk += 15;
  }

  return Math.min(100, Math.round(risk));
}


/* =====================================================
   🔥 자동 눌림목 계산
===================================================== */

function calculatePullback(stock){

  const current = num(
    stock.price ??
    stock.currentPrice ??
    stock.close
  );

  const high = num(
    stock.high ??
    stock.dayHigh ??
    current
  );

  const low = num(
    stock.low ??
    stock.dayLow
  );

  const change = num(
    stock.change ??
    stock.changePct ??
    stock.pctChange
  );

  let pullbackHigh;
  let pullbackLow;

  /*
    급등폭에 따라 눌림목 깊이를 자동 조절

    10% 미만 상승 → 고점 대비 2~4%
    10~30% 상승 → 고점 대비 3~6%
    30~50% 상승 → 고점 대비 4~8%
    50% 이상 급등 → 고점 대비 5~12%
  */

  if(change >= 50){

    pullbackHigh = high * 0.95;
    pullbackLow = high * 0.88;

  }else if(change >= 30){

    pullbackHigh = high * 0.96;
    pullbackLow = high * 0.92;

  }else if(change >= 10){

    pullbackHigh = high * 0.97;
    pullbackLow = high * 0.94;

  }else{

    pullbackHigh = high * 0.98;
    pullbackLow = high * 0.96;
  }


  /*
    이미 눌림목 아래로 너무 내려온 경우
    현재가 기준으로 다시 계산
  */

  if(current > 0 && current < pullbackLow){

    pullbackHigh = current * 1.01;
    pullbackLow = current * 0.97;
  }


  /*
    당일 저점보다 지나치게 아래로 내려가는 것 방지
  */

  if(low > 0 && pullbackLow < low){

    pullbackLow = low;

  }

  return {
    low: pullbackLow,
    high: pullbackHigh
  };
}


/* =====================================================
   점수 상태
===================================================== */

function level(score){

  if(score >= 80){
    return "매우 높음";
  }

  if(score >= 60){
    return "높음";
  }

  if(score >= 40){
    return "보통";
  }

  if(score >= 20){
    return "낮음";
  }

  return "매우 낮음";
}


/* =====================================================
   종목 화면 출력
===================================================== */

function renderStock(stock){

  const ticker =
    stock.ticker ??
    stock.symbol ??
    "UNKNOWN";

  const name =
    stock.name ??
    stock.company ??
    "미국 급등주";

  const currentPrice = num(
    stock.price ??
    stock.currentPrice ??
    stock.close
  );

  const change = num(
    stock.change ??
    stock.changePct ??
    stock.pctChange
  );

  const rvol = num(
    stock.rvol ??
    stock.relativeVolume ??
    stock.volumeRatio
  );


  /* 점수 계산 */

  const leaderScore =
    calculateLeader(stock);

  const mainPlayerScore =
    calculateMainPlayer(stock);

  const dumpRisk =
    calculateDumpRisk(stock);

  const pullback =
    calculatePullback(stock);


  /*
    진입가

    자동 눌림목 구간의 상단~하단을 사용
  */

  const entryLow = pullback.low;
  const entryHigh = pullback.high;


  /*
    지지선

    눌림목 하단보다 조금 아래
  */

  const support =
    entryLow * 0.98;


  /*
    손절가

    지지선보다 3% 아래
  */

  const stop =
    support * 0.97;


  /*
    목표가

    현재가와 당일 고점 기준
  */

  const target1 =
    Math.max(
      currentPrice * 1.08,
      num(stock.high ?? stock.dayHigh)
    );

  const target2 =
    target1 * 1.10;


  document.getElementById("app").innerHTML = `

    <div class="card">

      <div class="rank">
        🏅 1위 · 오늘의 대장 후보
      </div>


      <div class="ticker">
        ${ticker}
      </div>


      <div class="name">
        ${name}
      </div>


      <div class="top-info">

        <div>
          <div class="label">현재가</div>
          <div class="value">
            ${price(currentPrice)}
          </div>
        </div>

        <div>
          <div class="label">등락률</div>
          <div class="value ${change >= 0 ? "up" : "red"}">
            ${change >= 0 ? "+" : ""}${change.toFixed(1)}%
          </div>
        </div>

        <div>
          <div class="label">RVOL</div>
          <div class="value">
            ${rvol ? "×" + rvol.toFixed(1) : "-"}
          </div>
        </div>

      </div>


      <!-- 오늘의 대장 가능성 -->

      <div class="score-box">

        <div class="score-title">
          👑 오늘의 대장 가능성
        </div>

        <div class="score-value">
          ${leaderScore} / 100
        </div>

        <div class="bar">
          <div
            class="bar-fill"
            style="width:${leaderScore}%">
          </div>
        </div>

      </div>


      <!-- 주포 개입 가능성 -->

      <div class="score-box">

        <div class="score-title">
          🔥 주포 개입 가능성
        </div>

        <div class="score-value purple">
          ${mainPlayerScore}% · ${level(mainPlayerScore)}
        </div>

        <div class="bar">
          <div
            class="bar-fill bar-purple"
            style="width:${mainPlayerScore}%">
          </div>
        </div>

      </div>


      <!-- 설거지 위험 -->

      <div class="score-box">

        <div class="score-title">
          ⚠️ 설거지 위험
        </div>

        <div class="score-value ${dumpRisk >= 50 ? "red" : "green"}">
          ${dumpRisk}% · ${level(100 - dumpRisk)}
        </div>

        <div class="bar">
          <div
            class="bar-fill ${dumpRisk >= 50 ? "bar-red" : ""}"
            style="width:${dumpRisk}%">
          </div>
        </div>

      </div>


      <!-- 🔥 자동 눌림목 추가 -->

      <div class="pullback-box">

        <div class="pullback-title">
          🔥 자동 눌림목
        </div>

        <div class="pullback-range">
          ${price(entryLow)} ~ ${price(entryHigh)}
        </div>

        <div class="pullback-desc">
          급등폭과 당일 고점을 기준으로 자동 계산된 진입 구간
        </div>

      </div>


      <!-- 매매 레벨 -->

      <div class="trade-grid">

        <div class="trade-item">
          <div class="label">진입가</div>
          <div class="price green">
            ${price(entryLow)}~${price(entryHigh)}
          </div>
        </div>

        <div class="trade-item">
          <div class="label">손절가</div>
          <div class="price red">
            ${price(stop)}
          </div>
        </div>

        <div class="trade-item">
          <div class="label">1차 목표</div>
          <div class="price orange">
            ${price(target1)}
          </div>
        </div>

        <div class="trade-item">
          <div class="label">2차 목표</div>
          <div class="price orange">
            ${price(target2)}
          </div>
        </div>

      </div>


      <div class="status">
        ${change > 0 ? "상승" : "하락"} ·
        ${mainPlayerScore >= 60 ? "🔥 상승 모멘텀" : "관망"}
      </div>


      <div class="note">
        ※ 자동 눌림목은 당일 고점·현재가·상승률을 기준으로 계산됩니다.<br>
        ※ 주포 개입 가능성은 거래량·고점 유지·상승률 등을 점수화합니다.<br>
        ※ 설거지 위험은 고점 대비 하락폭과 급등 후 위치를 기준으로 계산합니다.<br>
        ※ 참고용 스캐너이며 실제 매매 신호는 아닙니다.
      </div>

    </div>

  `;
}


/* 시작 */

loadData();

setInterval(loadData, 30000);

</script>

</body>
</html>
