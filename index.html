<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="300">
<title>US Stock Scanner</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f5f8;
  color:#172033;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.wrap{
  max-width:760px;
  margin:0 auto;
  padding:18px;
}

.header{
  background:linear-gradient(135deg,#ffffff,#edf4fb);
  border-radius:28px;
  padding:24px;
  margin-bottom:20px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.topline{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.title{
  font-size:30px;
  font-weight:900;
}

.live{
  background:#dff5e7;
  color:#168548;
  font-weight:900;
  padding:10px 18px;
  border-radius:22px;
}

.market{
  margin-top:12px;
  font-size:18px;
  font-weight:800;
  color:#64748b;
}

.card{
  background:#fff;
  border-radius:30px;
  padding:24px;
  box-shadow:0 8px 28px rgba(0,0,0,.07);
}

.rank{
  color:#64748b;
  font-size:20px;
  font-weight:800;
  margin-bottom:12px;
}

.symbol{
  font-size:56px;
  font-weight:1000;
  letter-spacing:-2px;
  line-height:1;
}

.type{
  margin-top:12px;
  color:#64748b;
  font-size:22px;
  font-weight:800;
}

.price-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-top:28px;
}

.label{
  color:#64748b;
  font-size:16px;
  font-weight:800;
}

.price{
  margin-top:7px;
  font-size:32px;
  font-weight:900;
}

.green{
  color:#168548;
}

.red{
  color:#d93025;
}

.gray{
  color:#64748b;
}

.score-box{
  margin-top:26px;
  padding:22px;
  border-radius:24px;
  background:#eef3f9;
}

.score-title{
  color:#64748b;
  font-size:17px;
  font-weight:800;
}

.score-number{
  margin-top:8px;
  font-size:38px;
  font-weight:1000;
}

.bar{
  width:100%;
  height:20px;
  margin-top:16px;
  background:#dbe2ea;
  border-radius:20px;
  overflow:hidden;
}

.fill{
  height:100%;
  background:linear-gradient(90deg,#1b9a52,#5ad07e);
  border-radius:20px;
  transition:width .4s;
}

.detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-top:20px;
}

.detail{
  background:#f5f7fa;
  padding:18px;
  border-radius:20px;
}

.detail strong{
  display:block;
  font-size:22px;
  margin-top:8px;
}

.alert{
  margin-top:22px;
  border:2px solid #f0c37a;
  background:#fffaf0;
  border-radius:24px;
  padding:20px;
}

.alert-title{
  font-size:20px;
  font-weight:900;
  color:#c65a08;
}

.alert-value{
  margin-top:8px;
  font-size:28px;
  font-weight:1000;
  color:#d35400;
}

.updated{
  text-align:center;
  margin-top:18px;
  color:#64748b;
  font-size:14px;
}

.error{
  text-align:center;
  padding:50px 20px;
  color:#d93025;
  font-weight:800;
}

@media(max-width:500px){
  .wrap{
    padding:12px;
  }

  .header,
  .card{
    border-radius:22px;
    padding:18px;
  }

  .title{
    font-size:24px;
  }

  .symbol{
    font-size:48px;
  }

  .price{
    font-size:27px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="header">
    <div class="topline">
      <div class="title">오늘의 급등주 후보</div>
      <div class="live">LIVE</div>
    </div>

    <div class="market">🔴 미국 시장 휴장</div>
  </div>

  <div id="app">
    <div class="card">
      <div class="error">데이터 불러오는 중...</div>
    </div>
  </div>

</div>

<script>

async function loadData(){

  try{

    const response = await fetch(
      "data.json?t=" + Date.now(),
      { cache:"no-store" }
    );

    if(!response.ok){
      throw new Error("데이터를 불러오지 못했습니다.");
    }

    const data = await response.json();

    const stocks = data.stocks || [];

    if(stocks.length === 0){
      throw new Error("종목 데이터가 없습니다.");
    }

    stocks.sort((a,b) => (b.score || 0) - (a.score || 0));

    const top = stocks[0];

    const price = Number(top.price || 0);
    const change = Number(top.change || 0);
    const score = Math.max(0,Math.min(100,Number(top.score || 0)));
    const volume = Number(top.volume || 0);

    const changeClass =
      change >= 0 ? "green" : "red";

    const changeSign =
      change >= 0 ? "+" : "";

    const entryLow = price * 0.985;
    const entryHigh = price * 1.005;
    const stop = price * 0.95;
    const target1 = price * 1.08;
    const target2 = price * 1.18;

    document.getElementById("app").innerHTML = `

      <div class="card">

        <div class="rank">
          🥇 1위 · 오늘의 대장주 후보
        </div>

        <div class="symbol">
          ${top.symbol || "-"}
        </div>

        <div class="type">
          미국 중소형주
        </div>

        <div class="price-row">

          <div>
            <div class="label">현재가</div>
            <div class="price">
              $${price.toFixed(2)}
            </div>
          </div>

          <div>
            <div class="label">등락률</div>
            <div class="price ${changeClass}">
              ${changeSign}${change.toFixed(2)}%
            </div>
          </div>

        </div>

        <div class="score-box">

          <div class="score-title">
            👑 오늘의 대장 가능성
          </div>

          <div class="score-number">
            ${score} / 100
          </div>

          <div class="bar">
            <div
              class="fill"
              style="width:${score}%">
            </div>
          </div>

        </div>

        <div class="detail-grid">

          <div class="detail">
            <div class="label">🔥 주도권 가능성</div>
            <strong class="green">
              ${score >= 80 ? "매우 높음" :
                score >= 65 ? "높음" :
                score >= 50 ? "보통" : "낮음"}
            </strong>
          </div>

          <div class="detail">
            <div class="label">📊 거래량</div>
            <strong>
              ${volume > 0 ? volume.toLocaleString() : "데이터 없음"}
            </strong>
          </div>

          <div class="detail">
            <div class="label">🎯 진입가</div>
            <strong class="green">
              $${entryLow.toFixed(2)} ~ $${entryHigh.toFixed(2)}
            </strong>
          </div>

          <div class="detail">
            <div class="label">🛑 손절가</div>
            <strong class="red">
              $${stop.toFixed(2)}
            </strong>
          </div>

          <div class="detail">
            <div class="label">1차 목표</div>
            <strong>
              $${target1.toFixed(2)}
            </strong>
          </div>

          <div class="detail">
            <div class="label">2차 목표</div>
            <strong>
              $${target2.toFixed(2)}
            </strong>
          </div>

        </div>

        <div class="alert">
          <div class="alert-title">
            🔥 자동 눌림목
          </div>

          <div class="alert-value">
            ${score >= 70 ? "매수 감시 가능" : "추가 데이터 대기"}
          </div>
        </div>

      </div>

      <div class="updated">
        마지막 업데이트: ${data.updated || "확인 중"}
      </div>
    `;

  }catch(error){

    document.getElementById("app").innerHTML = `
      <div class="card">
        <div class="error">
          ❌ 데이터 연결 오류<br><br>
          data.json 파일을 확인하세요.
        </div>
      </div>
    `;

    console.error(error);

  }

}

loadData();

setInterval(loadData, 30000);

</script>

</body>
</html>
