<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>US Small Cap Momentum Scanner</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#f3f5f8;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 color:#111827
}
header{
 background:#101827;
 color:white;
 padding:22px 18px
}
header h1{margin:0;font-size:25px}
header p{margin:7px 0 0;color:#aeb7c7}
main{padding:15px;max-width:760px;margin:auto}
.status,.card{
 background:white;
 border-radius:22px;
 padding:20px;
 margin-bottom:15px;
 box-shadow:0 5px 20px #0000000d
}
.status{
 font-size:19px;
 font-weight:800
}
.live{
 float:right;
 background:#dcfce7;
 color:#16803c;
 padding:8px 13px;
 border-radius:20px;
 font-size:13px
}
.session{
 margin-top:8px;
 font-size:12px;
 color:#64748b;
 font-weight:700
}
.card{border:1px solid #edf0f4}
.rank{color:#64748b;font-weight:800;font-size:14px}
.symbol{font-size:34px;font-weight:900;margin-top:5px}
.name{color:#64748b;margin-bottom:18px}
.row{
 display:flex;
 justify-content:space-between;
 gap:10px;
 margin:13px 0
}
.label{font-size:12px;color:#64748b}
.value{font-size:19px;font-weight:800;margin-top:3px}
.green{color:#16a34a}
.red{color:#dc2626}
.orange{color:#ea580c}
.purple{color:#7c3aed}
.score{
 background:#f1f5f9;
 padding:15px;
 border-radius:16px;
 margin:18px 0
}
.bar{
 height:9px;
 background:#e2e8f0;
 border-radius:10px;
 overflow:hidden;
 margin-top:8px
}
.bar div{
 height:100%;
 background:#16a34a
}
.master-bar div{background:#7c3aed}
.risk-bar div{background:#dc2626}
.pullback-box{
 background:#fff7ed;
 border:1px solid #fed7aa;
 padding:15px;
 border-radius:16px;
 margin:18px 0
}
.pullback-box .label{color:#9a3412}
.pullback-box .value{color:#ea580c}
.badges{margin-top:15px}
.badge{
 display:inline-block;
 background:#eff6ff;
 color:#2563eb;
 padding:8px 11px;
 border-radius:12px;
 margin:3px;
 font-size:12px;
 font-weight:700
}
.master-badge{
 background:#f3e8ff;
 color:#7e22ce
}
.risk-badge{
 background:#fee2e2;
 color:#b91c1c
}
.pullback-badge{
 background:#fff7ed;
 color:#c2410c
}
.small{
 font-size:12px;
 color:#64748b;
 margin-top:12px
}
footer{
 text-align:center;
 color:#94a3b8;
 padding:20px
}
</style>
</head>

<body>

<header>
<h1>🇺🇸 US Small Cap Momentum Scanner</h1>
<p>미국 중소형 급등주 · 주포 개입 가능성 분석</p>
</header>

<main>

<div class="status">
오늘의 급등주 후보
<span class="live">LIVE</span>
<div class="session" id="sessionText">시장 상태 확인 중...</div>
</div>

<div id="list">데이터 불러오는 중...</div>

</main>

<footer>
US Small Cap Momentum Scanner
</footer>

<script>

function num(...values){
 for(const v of values){
  const n=Number(v);
  if(Number.isFinite(n) && n!==0) return n;
 }
 return 0;
}

function getSession(){
 const now=new Date();

 const parts=new Intl.DateTimeFormat("en-US",{
  timeZone:"America/New_York",
  hour:"2-digit",
  minute:"2-digit",
  hour12:false,
  weekday:"short"
 }).formatToParts(now);

 const obj={};
 parts.forEach(p=>obj[p.type]=p.value);

 const hour=Number(obj.hour);
 const minute=Number(obj.minute);
 const total=hour*60+minute;

 if(["Sat","Sun"].includes(obj.weekday)){
  return {type:"CLOSED",label:"🔴 미국 시장 휴장"};
 }

 if(total>=240 && total<570){
  return {type:"PRE",label:"🌅 프리장 데이터 분석 중"};
 }

 if(total>=570 && total<960){
  return {type:"REGULAR",label:"🟢 미국 정규장 실시간 분석"};
 }

 if(total>=960 && total<1200){
  return {type:"AFTER",label:"🌙 애프터·데이장 데이터 분석 중"};
 }

 return {type:"CLOSED",label:"⚫ 장외 시간 · 최신 데이터 기준 분석"};
}

async function load(){

try{

const r=await fetch("data.json?t="+Date.now());
const d=await r.json();

const session=getSession();
document.getElementById("sessionText").textContent=session.label;

let stocks=d.stocks || [];

const mega=[
"AAPL","MSFT","NVDA","AMZN","GOOGL","GOOG",
"META","TSLA","AVGO","BRK.A","BRK.B",
"JPM","V","MA","WMT","LLY","XOM","JNJ",
"ORCL","COST","NFLX","PLTR"
];

stocks=stocks.filter(s=>{

const symbol=String(s.symbol||"").toUpperCase();

const price=num(
 s.price,
 s.last,
 s.lastPrice,
 s.currentPrice,
 s.regularMarketPrice,
 s.afterHoursPrice,
 s.postMarketPrice,
 s.preMarketPrice,
 s.extendedHoursPrice
);

const cap=num(
 s.marketCap,
 s.market_cap,
 s.marketcap
);

if(mega.includes(symbol)) return false;
if(price<=0) return false;
if(price>20) return false;
if(cap>0 && cap>2000000000) return false;

return true;
});

stocks=stocks.map(s=>{

let price=num(
 s.price,
 s.last,
 s.lastPrice,
 s.currentPrice,
 s.regularMarketPrice,
 s.afterHoursPrice,
 s.postMarketPrice,
 s.preMarketPrice,
 s.extendedHoursPrice
);

let change=num(
 s.change,
 s.changePercent,
 s.change_pct,
 s.percentChange,
 s.regularMarketChangePercent,
 s.afterHoursChangePercent,
 s.postMarketChangePercent,
 s.preMarketChangePercent,
 s.extendedHoursChangePercent
);

let volume=num(
 s.volume,
 s.totalVolume,
 s.regularMarketVolume,
 s.dayVolume,
 s.sessionVolume,
 s.extendedHoursVolume,
 s.afterHoursVolume,
 s.postMarketVolume,
 s.preMarketVolume
);

let avgVolume=num(
 s.avgVolume,
 s.averageVolume,
 s.avg_volume,
 s.averageDailyVolume,
 s.avgDailyVolume
);

let high=num(
 s.high,
 s.dayHigh,
 s.regularMarketDayHigh,
 s.sessionHigh,
 s.extendedHoursHigh,
 s.afterHoursHigh,
 s.postMarketHigh,
 s.preMarketHigh
);

let low=num(
 s.low,
 s.dayLow,
 s.regularMarketDayLow,
 s.sessionLow,
 s.extendedHoursLow,
 s.afterHoursLow,
 s.postMarketLow,
 s.preMarketLow
);

const previousClose=num(
 s.previousClose,
 s.prevClose,
 s.regularMarketPreviousClose,
 s.close
);

if(!change && previousClose>0 && price>0){
 change=((price-previousClose)/previousClose)*100;
}

let score=0;
let masterScore=0;
let riskScore=0;

let tags=[];
let masterTags=[];
let riskTags=[];

let ratio=0;
let rvolAvailable=false;

if(avgVolume>0 && volume>0){
 ratio=volume/avgVolume;
 rvolAvailable=true;
}

if(change>=20){
 score+=25;
 tags.push("급등");
}else if(change>=10){
 score+=20;
 tags.push("상승");
}else if(change>=5){
 score+=12;
 tags.push("상승세");
}

if(rvolAvailable){

 if(ratio>=10){
  score+=30;
  tags.push("거래량 폭증");
 }else if(ratio>=5){
  score+=25;
  tags.push("거래량 급증");
 }else if(ratio>=2){
  score+=15;
  tags.push("거래량 증가");
 }else{
  score+=8;
 }

}else if(volume>0){

 score+=8;
 tags.push("실시간 거래량");

 if(volume>=10000000){
  score+=18;
  tags.push("대량 거래");
 }else if(volume>=3000000){
  score+=12;
  tags.push("거래 집중");
 }

}

if(price<1){
 score+=10;
 tags.push("$1 이하");
}else if(price<3){
 score+=7;
 tags.push("저가주");
}else if(price<10){
 score+=4;
}

const highHold=high>0 && price>=high*0.97;

if(high>0 && price>=high*0.98){
 score+=15;
 tags.push("고가 부근");
}

if(change>=10 && (
 ratio>=3 ||
 (!rvolAvailable && volume>=3000000)
)){
 score+=10;
 tags.push("수급 집중");
}

if(change>=15){
 score+=5;
 tags.push("모멘텀");
}

if(rvolAvailable){

 if(ratio>=15){
  masterScore+=30;
  masterTags.push("RVOL 15배+");
 }else if(ratio>=10){
  masterScore+=25;
  masterTags.push("RVOL 10배+");
 }else if(ratio>=5){
  masterScore+=20;
  masterTags.push("RVOL 5배+");
 }else if(ratio>=2){
  masterScore+=10;
  masterTags.push("평균 이상 거래량");
 }

}else if(volume>0){

 if(volume>=10000000){
  masterScore+=20;
  masterTags.push("대량 거래 집중");
 }else if(volume>=3000000){
  masterScore+=12;
  masterTags.push("거래량 집중");
 }else if(volume>=500000){
  masterScore+=6;
  masterTags.push("장중 거래 발생");
 }

}

if(change>=30){
 masterScore+=20;
 masterTags.push("초강력 상승");
}else if(change>=20){
 masterScore+=17;
 masterTags.push("강한 상승");
}else if(change>=10){
 masterScore+=12;
 masterTags.push("상승 모멘텀");
}

if(highHold){
 masterScore+=20;
 masterTags.push("고점 부근 유지");
}else if(high>0 && price>=high*0.93){
 masterScore+=10;
 masterTags.push("상승 추세 유지");
}

if(change>=10 && (
 ratio>=5 ||
 (!rvolAvailable && volume>=3000000)
)){
 masterScore+=15;
 masterTags.push("가격·거래량 동시 증가");
}

if(price<5 && (
 ratio>=5 ||
 volume>=3000000
)){
 masterScore+=8;
 masterTags.push("저가주 수급 집중");
}

if(low>0){

 const rebound=((price-low)/low)*100;

 if(rebound>=20){
  masterScore+=10;
  masterTags.push("저점 강한 반등");
 }else if(rebound>=10){
  masterScore+=5;
 }

}

if(high>0){

 const pullback=((high-price)/high)*100;

 if(pullback>=30){
  riskScore+=35;
  riskTags.push("고점 대비 급락");
 }else if(pullback>=20){
  riskScore+=25;
  riskTags.push("고점 이탈");
 }else if(pullback>=10){
  riskScore+=10;
 }

}

if(change>=20 && high>0 && price<high*0.90){
 riskScore+=20;
 riskTags.push("급등 후 매물 출회");
}

if(
 (ratio>=10 || (!rvolAvailable && volume>=10000000)) &&
 high>0 &&
 price<high*0.85
){
 riskScore+=20;
 riskTags.push("대량 거래 후 약세");
}

let pullbackLow=0;
let pullbackHigh=0;
let pullbackLevel="데이터 부족";
let pullbackPct=0;

if(high>0 && low>0 && high>low){

 const range=high-low;

 pullbackHigh=high-(range*0.15);
 pullbackLow=high-(range*0.30);

 if(price>=pullbackLow && price<=pullbackHigh){
  pullbackLevel="🔥 눌림목 구간";
 }else if(price>pullbackHigh){
  pullbackLevel="⏳ 고점 추격 주의";
 }else{
  pullbackLevel="⚠️ 지지 확인 필요";
 }

 pullbackPct=((high-price)/high)*100;

}else if(previousClose>0 && price>0){

 pullbackHigh=price*0.985;
 pullbackLow=price*0.95;
 pullbackLevel="📊 데이장 기준 임시 눌림 구간";

}

score=Math.min(100,Math.max(0,score));
masterScore=Math.min(100,Math.max(0,masterScore));
riskScore=Math.min(100,Math.max(0,riskScore));

let masterLevel="관망";

if(masterScore>=80){
 masterLevel="🔥 매우 높음";
}else if(masterScore>=65){
 masterLevel="🟣 높음";
}else if(masterScore>=45){
 masterLevel="🟡 주목";
}else{
 masterLevel="⚪ 낮음";
}

let riskLevel="낮음";

if(riskScore>=60){
 riskLevel="🔴 높음";
}else if(riskScore>=35){
 riskLevel="🟠 주의";
}else{
 riskLevel="🟢 낮음";
}

const leaderScore=Math.min(
 100,
 Math.max(
 0,
 Math.round(
  score*0.55 +
  masterScore*0.35 -
  riskScore*0.20
 )
 )
);

const entryLow=price*0.985;
const entryHigh=price*1.005;
const stop=price*0.947;
const target1=price*1.084;
const target2=price*1.184;

return{
 ...s,
 price,
 change,
 volume,
 avgVolume,
 high,
 low,
 score,
 masterScore,
 riskScore,
 leaderScore,
 masterLevel,
 riskLevel,
 ratio,
 rvolAvailable,
 pullbackLow,
 pullbackHigh,
 pullbackLevel,
 pullbackPct,
 tags:[...new Set(tags)],
 masterTags:[...new Set(masterTags)],
 riskTags:[...new Set(riskTags)],
 entryLow,
 entryHigh,
 stop,
 target1,
 target2
};

});

stocks.sort((a,b)=>
 Number(b.leaderScore||0)-Number(a.leaderScore||0)
);

let html="";

stocks.slice(0,10).forEach((s,i)=>{

html+=`

<div class="card">

<div class="rank">
🏅 ${i+1}위 · ${i===0 ? "오늘의 대장주 후보" : "급등 후보"}
</div>

<div class="symbol">
${s.symbol || "N/A"}
</div>

<div class="name">
${s.name || "미국 중소형주"}
</div>

<div class="row">

<div>
<div class="label">현재가</div>
<div class="value">$${s.price.toFixed(2)}</div>
</div>

<div>
<div class="label">등락률</div>
<div class="value ${s.change>=0?"green":"red"}">
${s.change>=0?"+":""}${s.change.toFixed(1)}%
</div>
</div>

<div>
<div class="label">RVOL</div>
<div class="value">
${
 s.rvolAvailable
 ? s.ratio.toFixed(1)+"배"
 : s.volume>0
 ? "실시간"
 : "-"
}
</div>
</div>

</div>

<div class="score">

<div class="label">👑 오늘의 대장 가능성</div>

<div class="value">
${s.leaderScore} / 100
</div>

<div class="bar">
<div style="width:${s.leaderScore}%"></div>
</div>

</div>

<div class="score">

<div class="label">🔥 주포 개입 가능성</div>

<div class="value purple">
${s.masterScore}% · ${s.masterLevel}
</div>

<div class="bar master-bar">
<div style="width:${s.masterScore}%"></div>
</div>

</div>

<div class="score">

<div class="label">⚠️ 설거지 위험</div>

<div class="value ${s.riskScore>=35?"red":"green"}">
${s.riskScore}% · ${s.riskLevel}
</div>

<div class="bar risk-bar">
<div style="width:${s.riskScore}%"></div>
</div>

</div>

<div class="pullback-box">

<div class="label">🔥 자동 눌림목</div>

<div class="value">
$${s.pullbackLow>0?s.pullbackLow.toFixed(2):"-"}
~
$${s.pullbackHigh>0?s.pullbackHigh.toFixed(2):"-"}
</div>

<div class="small">
${s.pullbackLevel}
${s.pullbackPct>0
 ? " · 고점 대비 "+s.pullbackPct.toFixed(1)+"% 눌림"
 : ""}
</div>

</div>

<div class="row">

<div>
<div class="label">진입가</div>
<div class="value green">
$${s.entryLow.toFixed(2)}~${s.entryHigh.toFixed(2)}
</div>
</div>

<div>
<div class="label">손절가</div>
<div class="value red">
$${s.stop.toFixed(2)}
</div>
</div>

</div>

<div class="row">

<div>
<div class="label">1차 목표</div>
<div class="value orange">
$${s.target1.toFixed(2)}
</div>
</div>

<div>
<div class="label">2차 목표</div>
<div class="value orange">
$${s.target2.toFixed(2)}
</div>
</div>

</div>

<div class="badges">

${s.tags.map(t=>
`<span class="badge">${t}</span>`
).join("")}

${s.masterTags.map(t=>
`<span class="badge master-badge">🔥 ${t}</span>`
).join("")}

${s.riskTags.map(t=>
`<span class="badge risk-badge">⚠️ ${t}</span>`
).join("")}

${s.pullbackLevel==="🔥 눌림목 구간"
? `<span class="badge pullback-badge">🔥 눌림목 진입 구간</span>`
: ""}

</div>

<div class="small">
※ 프리장·정규장·애프터/데이장 데이터를 자동으로 분석합니다.<br>
※ 평균 거래량 데이터가 없는 장외 거래는 실시간 거래량 기준으로 대체 계산합니다.<br>
※ 주포 개입 가능성은 가격·거래량·고점 유지 패턴을 기반으로 한 추정 지표입니다.
</div>

</div>

`;

});

if(!html){

html=`
<div class="card">
현재 조건에 맞는 급등주 후보가 없습니다.
</div>
`;

}

document.getElementById("list").innerHTML=html;

}catch(e){

console.error(e);

document.getElementById("list").innerHTML=`

<div class="card">
데이터를 불러오지 못했습니다.<br><br>
data.json 또는 스캐너 업데이트를 확인하세요.
</div>

`;

}

}

load();
setInterval(load,60000);

</script>

</body>
</html>
