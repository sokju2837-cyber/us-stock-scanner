<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>US Small Cap Momentum Scanner</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f3f5f8;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 color:#111827
}

header{
 background:#101827;
 color:white;
 padding:22px 18px
}

header h1{
 margin:0;
 font-size:25px
}

header p{
 margin:7px 0 0;
 color:#aeb7c7
}

main{
 padding:15px;
 max-width:760px;
 margin:auto
}

.status,.card{
 background:white;
 border-radius:22px;
 padding:20px;
 margin-bottom:15px;
 box-shadow:0 5px 20px #0000000d
}

.status{
 font-size:19px;
 font-weight:800
}

.live{
 float:right;
 background:#dcfce7;
 color:#16803c;
 padding:8px 13px;
 border-radius:20px;
 font-size:13px
}

.card{
 border:1px solid #edf0f4
}

.rank{
 color:#64748b;
 font-weight:800;
 font-size:14px
}

.symbol{
 font-size:34px;
 font-weight:900;
 margin-top:5px
}

.name{
 color:#64748b;
 margin-bottom:18px
}

.row{
 display:flex;
 justify-content:space-between;
 gap:10px;
 margin:13px 0
}

.label{
 font-size:12px;
 color:#64748b
}

.value{
 font-size:19px;
 font-weight:800;
 margin-top:3px
}

.green{
 color:#16a34a
}

.red{
 color:#dc2626
}

.orange{
 color:#ea580c
}

.purple{
 color:#7c3aed
}

.score{
 background:#f1f5f9;
 padding:15px;
 border-radius:16px;
 margin:18px 0
}

.bar{
 height:9px;
 background:#e2e8f0;
 border-radius:10px;
 overflow:hidden;
 margin-top:8px
}

.bar div{
 height:100%;
 background:#16a34a
}

.pullback{
 background:#fff7ed;
 border:1px solid #fed7aa;
 padding:15px;
 border-radius:16px;
 margin:18px 0
}

.badges{
 margin-top:15px
}

.badge{
 display:inline-block;
 background:#eff6ff;
 color:#2563eb;
 padding:8px 11px;
 border-radius:12px;
 margin:3px;
 font-size:12px;
 font-weight:700
}

.small{
 font-size:12px;
 color:#64748b;
 margin-top:12px
}

footer{
 text-align:center;
 color:#94a3b8;
 padding:20px
}
</style>
</head>

<body>

<header>
<h1>🇺🇸 US Small Cap Momentum Scanner</h1>
<p>미국 중소형 급등주 실시간 후보 스캐너</p>
</header>

<main>

<div class="status">
오늘의 급등주 후보
<span class="live">LIVE</span>
</div>

<div id="list">데이터 불러오는 중...</div>

</main>

<footer>
US Small Cap Momentum Scanner
</footer>

<script>

async function load(){

try{

const r = await fetch("data.json?t=" + Date.now());
const d = await r.json();

let stocks = d.stocks || [];


// =====================================
// 우량주 / 대형주 제거
// =====================================

const mega=[
"AAPL","MSFT","NVDA","AMZN","GOOGL","GOOG",
"META","TSLA","AVGO","BRK.A","BRK.B",
"JPM","V","MA","WMT","LLY","XOM","JNJ",
"ORCL","COST","NFLX","PLTR"
];

stocks=stocks.filter(s=>{

const symbol=String(s.symbol||"").toUpperCase();

const price=Number(s.price||0);

const cap=Number(
 s.marketCap ||
 s.market_cap ||
 s.marketcap ||
 0
);

if(mega.includes(symbol)) return false;

if(price<=0) return false;

if(price>20) return false;

if(cap>0 && cap>2000000000) return false;

return true;

});


// =====================================
// 급등주 점수 + 자동 눌림목 계산
// =====================================

stocks=stocks.map(s=>{

const price=Number(s.price||0);

const change=Number(
 s.change ||
 s.changePercent ||
 s.change_pct ||
 0
);

const volume=Number(s.volume||0);

const avgVolume=Number(
 s.avgVolume ||
 s.averageVolume ||
 s.avg_volume ||
 0
);

const high=Number(s.high||price);

const low=Number(s.low||price);

let score=0;

let tags=[];


// =====================================
// 상승률 점수
// =====================================

if(change>=30){

 score+=30;
 tags.push("초강세");

}else if(change>=20){

 score+=25;
 tags.push("급등");

}else if(change>=10){

 score+=20;
 tags.push("상승");

}else if(change>=5){

 score+=12;

}


// =====================================
// 거래량 점수
// =====================================

let ratio=0;

if(avgVolume>0){

 ratio=volume/avgVolume;

 if(ratio>=10){

  score+=30;
  tags.push("거래량 폭증");

 }else if(ratio>=5){

  score+=25;
  tags.push("거래량 급증");

 }else if(ratio>=2){

  score+=15;
  tags.push("거래량 증가");

 }

}else if(volume>0){

 score+=10;
 tags.push("거래량");

}


// =====================================
// 저가주 가점
// =====================================

if(price<1){

 score+=10;
 tags.push("$1 이하");

}else if(price<3){

 score+=7;
 tags.push("저가주");

}else if(price<10){

 score+=4;

}


// =====================================
// 고가 돌파
// =====================================

if(high>0 && price>=high*0.98){

 score+=15;
 tags.push("고가 근접");

}


// =====================================
// 거래량 + 상승 동시 발생
// =====================================

if(change>=10 && ratio>=3){

 score+=10;
 tags.push("수급 집중");

}


// =====================================
// 강한 상승 모멘텀
// =====================================

if(change>=15){

 score+=5;
 tags.push("상승 모멘텀");

}


// =====================================
// 점수 최대 100
// =====================================

score=Math.min(100,score);


// =====================================
// 자동 눌림목 계산
// =====================================

// 당일 변동폭
const range=Math.max(high-low, price*0.01);

// 현재가가 고점 근처인지
const highPosition=price/high;


// 강한 급등주
// 고점에서 15~25% 눌림
if(change>=20 && highPosition>=0.95){

 pullbackHigh=high-(range*0.15);
 pullbackLow=high-(range*0.25);

}

// 일반 급등
// 고점에서 20~35% 눌림
else if(change>=10){

 pullbackHigh=high-(range*0.20);
 pullbackLow=high-(range*0.35);

}

// 약한 상승
// 고점에서 25~45% 눌림
else{

 pullbackHigh=high-(range*0.25);
 pullbackLow=high-(range*0.45);

}


// 눌림목 값 보호
pullbackLow=Math.max(low,pullbackLow);
pullbackHigh=Math.max(pullbackLow,pullbackHigh);


// =====================================
// 진입가
// =====================================

// 눌림목보다 위에서 재상승 확인 구간
const entryLow=Math.max(
 pullbackHigh,
 price*0.985
);

const entryHigh=Math.max(
 entryLow,
 price*1.005
);


// =====================================
// 지지 / 손절
// =====================================

const support=pullbackLow;

const stop=Math.max(
 low*0.98,
 support*0.97
);


// =====================================
// 목표가
// =====================================

// 고점 기준
const target1=Math.max(
 high*1.08,
 price*1.05
);

const target2=Math.max(
 high*1.18,
 price*1.12
);


// =====================================
// 눌림목 상태
// =====================================

let pullbackStatus="대기";

if(price<=pullbackHigh && price>=pullbackLow){

 pullbackStatus="진입 구간";

 tags.push("눌림목 진입");

}else if(price>pullbackHigh){

 pullbackStatus="눌림 대기";

}else if(price<pullbackLow){

 pullbackStatus="지지 이탈";

}


// =====================================
// 결과
// =====================================

return{

 ...s,

 score,

 tags:[...new Set(tags)],

 ratio,

 pullbackLow,

 pullbackHigh,

 pullbackStatus,

 entryLow,

 entryHigh,

 support,

 stop,

 target1,

 target2

};

});


// =====================================
// 점수순 정렬
// =====================================

stocks.sort((a,b)=>
 Number(b.score||0)-Number(a.score||0)
);


// =====================================
// 상위 10개 출력
// =====================================

let html="";

stocks.slice(0,10).forEach((s,i)=>{

const price=Number(s.price||0);

const change=Number(
 s.change ||
 s.changePercent ||
 s.change_pct ||
 0
);

const volume=Number(s.volume||0);

html+=`

<div class="card">

<div class="rank">
🏅 ${i+1}위 · ${i===0 ? "오늘의 대장주 후보" : "급등 후보"}
</div>


<div class="symbol">
${s.symbol || "N/A"}
</div>


<div class="name">
${s.name || "미국 중소형주"}
</div>


<div class="row">

<div>
<div class="label">현재가</div>
<div class="value">
$${price.toFixed(2)}
</div>
</div>

<div>
<div class="label">등락률</div>
<div class="value ${change>=0?"green":"red"}">
${change>=0?"+":""}${change.toFixed(1)}%
</div>
</div>

<div>
<div class="label">거래량</div>
<div class="value">
${volume ? volume.toLocaleString() : "-"}
</div>
</div>

</div>


<div class="score">

<div class="label">
👑 오늘의 대장 가능성
</div>

<div class="value">
${s.score} / 100
</div>

<div class="bar">
<div style="width:${s.score}%"></div>
</div>

</div>


<div class="pullback">

<div class="label">
🔥 자동 눌림목
</div>

<div class="value orange">
$${s.pullbackLow.toFixed(2)}
~
$${s.pullbackHigh.toFixed(2)}
</div>

<div class="small">
${s.pullbackStatus}
</div>

</div>


<div class="row">

<div>
<div class="label">진입가</div>
<div class="value green">
$${s.entryLow.toFixed(2)}
~
$${s.entryHigh.toFixed(2)}
</div>
</div>

<div>
<div class="label">지지선</div>
<div class="value purple">
$${s.support.toFixed(2)}
</div>
</div>

<div>
<div class="label">손절가</div>
<div class="value red">
$${s.stop.toFixed(2)}
</div>
</div>

</div>


<div class="row">

<div>
<div class="label">1차 목표</div>
<div class="value orange">
$${s.target1.toFixed(2)}
</div>
</div>

<div>
<div class="label">2차 목표</div>
<div class="value orange">
$${s.target2.toFixed(2)}
</div>
</div>

</div>


<div class="badges">

${s.tags.map(t=>
`<span class="badge">${t}</span>`
).join("")}

</div>


<div class="small">
※ 눌림목은 당일 고점·저점·현재 위치·상승률을 기준으로 자동 계산됩니다.<br>
※ 급등 가능성을 점수화한 참고용 스캐너이며 매매 신호가 아닙니다.
</div>

</div>

`;

});


if(!html){

html=`

<div class="card">
현재 조건에 맞는 급등주 후보가 없습니다.
</div>

`;

}


document.getElementById("list").innerHTML=html;


}catch(e){

console.error(e);

document.getElementById("list").innerHTML=`

<div class="card">

데이터를 불러오지 못했습니다.<br><br>

data.json 또는 스캐너 업데이트를 확인하세요.

</div>

`;

}

}


load();

setInterval(load,60000);

</script>

</body>
</html>
