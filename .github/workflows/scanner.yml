name: US Stock Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get stock data
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone
          import os
          key = os.environ.get("FINNHUB_API_KEY", "")

          symbols = [
              "AAPL","NVDA","AMD","TSLA","PLTR",
              "SMCI","MARA","RIOT","SOUN","IONQ",
              "RGTI","QBTS","QUBT","BBAI","AI",
              "MSTR","COIN","HOOD","LCID","RIVN",
              "NIO","GME","AMC","ASTS","RKLB",
              "LUNR","ACHR","JOBY","AUR","DNA"
          ]

          results = []

          for symbol in symbols:
              try:
                  url = "https://finnhub.io/api/v1/quote?" + urllib.parse.urlencode({
                      "symbol": symbol,
                      "token": key
                  })

                  with urllib.request.urlopen(url, timeout=10) as r:
                      d = json.loads(r.read().decode())

                  price = d.get("c", 0)
                  prev = d.get("pc", 0)
                  high = d.get("h", 0)
                  low = d.get("l", 0)
                  volume = d.get("v", 0)

                  if not price or not prev:
                      continue

                  change = ((price - prev) / prev) * 100

                  score = 0

                  if change >= 5:
                      score += 30
                  elif change >= 3:
                      score += 20
                  elif change >= 1:
                      score += 10

                  if high and price >= high * 0.98:
                      score += 20

                  if change > 0:
                      score += 20

                  if volume:
                      score += 20

                  results.append({
                      "symbol": symbol,
                      "price": round(price, 2),
                      "change": round(change, 2),
                      "volume": volume,
                      "score": min(score, 100)
                  })

              except Exception as e:
                  print(symbol, e)

          results.sort(key=lambda x: x["score"], reverse=True)

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "mode": "LIVE",
              "stocks": results
          }

          with open("data.json", "w") as f:
              json.dump(output, f, indent=2)

          print(json.dumps(output, indent=2))
          PY

      - name: Save data
        run: |
          git config user.name "US Stock Scanner"
          git config user.email "scanner@users.noreply.github.com"
          git add data.json
          git commit -m "Update stock scanner data" || exit 0
          git push
